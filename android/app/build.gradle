// Meta Quest (Quest 2 / Pro / 3 / 3S) build of Stunt Car Racer VR.
// Run ../fetch_deps.sh (or fetch_deps.ps1) once first: it downloads SDL3 and the OpenXR SDK
// into android/third_party so the Java and native code use the same SDL version.
plugins {
    id 'com.android.application'
}

def thirdParty = file('../third_party')

// Version: base from ../../VERSION; CI sets SCR_VERSION_NAME (e.g. 0.1.0 or 0.1.0-dev.42)
// and SCR_VERSION_CODE (the build number, always increasing so updates install).
def baseVersion = file('../../VERSION').text.trim()
def scrVersionName = System.getenv('SCR_VERSION_NAME') ?: "${baseVersion}-local"
def scrVersionCode = (System.getenv('SCR_VERSION_CODE') ?: '1').toInteger()

// Release signing: CI decrypts the key to SCR_KEYSTORE (see android/signing/README.md).
def keystorePath = System.getenv('SCR_KEYSTORE')
def haveReleaseKey = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'com.stuntcarvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.stuntcarvr'
        minSdk 29          // Quest OS baseline
        targetSdk 32       // Horizon OS store requirement (Android 12L)
        versionCode scrVersionCode
        versionName scrVersionName
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          "-DSCR_VERSION_LABEL=${scrVersionName}",
                          '-DSCR_BUILD_TESTS=OFF',
                          "-DFETCHCONTENT_SOURCE_DIR_SDL3=${thirdParty}/SDL",
                          "-DFETCHCONTENT_SOURCE_DIR_OPENXR=${thirdParty}/OpenXR-SDK"
                targets 'StuntCarVR', 'openxr_loader'
            }
        }
    }

    signingConfigs {
        if (haveReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('SCR_KEYSTORE_PASSWORD')
                keyAlias 'stuntcarvr'
                keyPassword System.getenv('SCR_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (haveReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('No release key (SCR_KEYSTORE): signing with the debug key')
                signingConfig signingConfigs.debug
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${thirdParty}/SDL/android-project/app/src/main/java"]
            assets.srcDirs = ['../../assets']
        }
    }

    lint {
        // Google Play's target-SDK rule doesn't apply: Quest (Horizon OS) apps target 32
        disable 'ExpiredTargetSdkVersion'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
